name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --prefix dev --ignore-scripts
      - run: node tools/run-tests.ts
      - run: node tools/check.ts

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --prefix dev --ignore-scripts
      - run: node tools/check-browser.ts --fetch --with-deps --engines chromium,firefox,webkit
      - run: node tools/check-browser.ts --engines chromium,firefox,webkit
      - if: ${{ !cancelled() }}
        run: node tools/shots.ts --engines chromium,firefox,webkit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks
          path: |
            build/shots/
            build/browser/
          retention-days: 14
