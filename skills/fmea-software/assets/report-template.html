<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--@title--></title>
<style>
:root { color-scheme: light; --ink:#14171a; --muted:#5b6269; --line:#d7dbdf; --fill:#f1f3f5; --soft:#f7f9fb; --hi:#8a1c1c; --link:#1a4f8b; }
* { box-sizing: border-box; }
body { margin:0; padding:2rem 1.5rem 4rem; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
main { max-width:72rem; margin:0 auto; }
a { color:var(--link); }
h1 { font-size:1.6rem; margin:0 0 .25rem; }
h2 { font-size:1.15rem; margin:2.25rem 0 .5rem; padding-bottom:.25rem; border-bottom:1px solid var(--line); }
h3 { font-size:1rem; margin:0; }
code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; }
.muted { color:var(--muted); }
ul { margin:.25rem 0; padding-left:1.2rem; }
ul.tree { list-style:none; margin:0; padding:0; }
ul.tree ul.tree { margin-left:.3rem; padding-left:.95rem; border-left:2px solid #e3e6e9; }
.el { display:grid; grid-template-columns:calc(clamp(16rem, 28vw, 20rem) - var(--el-depth, 0) * (1.25rem + 2px)) minmax(0,1fr); column-gap:1.5rem; padding:.55rem 0; border-top:1px solid #eceff1; }
.vocabulary + ul.tree > li:first-child > .el { border-top:0; }
.el-who { min-width:0; overflow-wrap:anywhere; }
.el-name { display:block; font-weight:600; }
.el-tag { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 .7rem; }
.el-id { font-size:.86em; }
.el-prefix { color:var(--muted); }
.el-kind, .el-boundary, .el-security { font-size:.76em; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.el-security { color:var(--hi); padding:0 .3rem; border:1px solid currentColor; border-radius:3px; }
.el-desc { margin:0; max-width:84ch; }
.el-rationale { margin:.2rem 0 0; max-width:84ch; color:var(--muted); }
.vocabulary { margin:.25rem 0 .75rem; padding:.5rem .8rem; border:1px solid var(--line); border-radius:4px; background:#fafbfc; font-size:.93em; }
.vocabulary dl { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:.2rem .9rem; margin:0; }
.vocabulary dt { font-weight:600; white-space:nowrap; }
.vocabulary dd { margin:0; max-width:84ch; }
.el-facts { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:0 .8rem; margin:.3rem 0 0; max-width:84ch; font-size:.93em; }
.el-facts dt { color:var(--muted); font-weight:600; }
.el-facts dd { margin:0; }
dl.header { display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:.75rem 0 0; }
dl.header dt { font-weight:600; color:#4a5157; }
dl.header dd { margin:0; }

/* summary */
.strip { display:grid; grid-template-columns:2fr 3fr; gap:1rem; margin:1.1rem 0 .75rem; }
.strip-cap { font-size:.74rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 .4rem; padding-bottom:.25rem; border-bottom:1px solid var(--line); }
.tile-group { display:grid; grid-template-rows:auto 1fr; }
.tiles { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:.6rem; margin:0; }
.tile { border:1px solid var(--line); border-radius:5px; padding:.5rem .7rem; text-decoration:none; color:inherit; display:block; }
.tile .lbl, .lbl { display:block; font-size:.74rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.tile .big { display:block; font-size:1.4rem; font-weight:700; line-height:1.3; font-variant-numeric:tabular-nums; }
.tile .big small { font-size:.9rem; font-weight:400; color:var(--muted); }
.tile .sub { display:block; font-size:.85rem; color:var(--muted); }
.tile.alert { border-color:#b9838a; background:#fbf3f3; }
.tile.alert .big { color:var(--hi); }
.pcount { display:inline-flex; align-items:center; gap:.3rem; margin-right:.7rem; font-size:1.1rem; font-weight:700; }
.attn { border:1px solid var(--line); border-left:4px solid var(--hi); border-radius:4px; padding:.7rem 1rem .5rem; margin-bottom:1rem; }
.attn-title { font-size:1.1rem; font-weight:700; margin:0 0 .5rem; padding-bottom:.4rem; border-bottom:1px solid var(--line); }
.attn-item { display:grid; grid-template-columns:12.5rem 1fr; gap:.2rem 1rem; padding:.45rem 0; border-top:1px solid #eceff1; }
.attn-item:first-of-type { border-top:0; }
.attn-item .what { font-weight:600; }
.attn-item .why { display:block; color:var(--muted); font-size:.9rem; margin-top:.1rem; }
.key { border:1px solid var(--line); border-radius:4px; background:#fafbfc; padding:.5rem .8rem; margin:.5rem 0 .75rem; }
.key-title { font-size:1rem; font-weight:600; margin:0 0 .25rem; }
.key dl { display:grid; grid-template-columns:max-content 1fr; gap:.25rem .9rem; margin:0; }
.key dt { white-space:nowrap; }
.key dd { margin:0; }
abbr { text-decoration:underline dotted; text-underline-offset:2px; cursor:help; }
.toc { display:flex; flex-wrap:wrap; align-items:center; column-gap:.9rem; }
.toc a { display:flex; align-items:center; min-height:24px; white-space:nowrap; }

/* marks and badges */
.pri { display:inline-flex; align-items:center; justify-content:center; min-width:1.6rem; height:1.6rem; padding:0 .25rem; border-radius:4px; font-weight:700; font-size:.85rem; flex-shrink:0; }
.pri-top { background:var(--hi); color:#fff; }
.pri-mid { background:#fde8cf; color:#6b3d00; border:1px solid #d9a45b; }
.pri-low { background:#eef0f2; color:#4a5157; border:1px solid #b6bcc2; }
.mark { display:inline-block; padding:0 .4rem; border-radius:.6rem; font-size:.75rem; font-weight:600; border:1px solid #b6bcc2; white-space:nowrap; }
.mark-provisional { background:#fff4b8; }
.mark-handoff { background:#e2dcf7; }
.mark-stale { background:#fde8cf; }
.mark-blocker { background:#f6dada; border-color:#b9838a; color:var(--hi); }
.mark-warning { background:#fff; color:#6b5300; }

/* tables */
table { border-collapse:collapse; width:100%; margin:.5rem 0 0; }
.frame { overflow-x:auto; }
.frame > table { min-width:40rem; }
.caption { margin:.5rem 0 0; padding-bottom:.3rem; text-align:left; color:var(--muted); font-size:.9rem; }
.caption + .frame > table { margin-top:0; }
h2 + .frame > table { margin-top:0; }
th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; vertical-align:top; }
th { background:var(--fill); font-weight:600; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.nw { white-space:nowrap; }
table.index th, table.index td { border-left:0; border-right:0; }
tr.done td { color:var(--muted); }

/* row sections */
article.row { margin-top:1.5rem; border-top:2px solid var(--ink); padding-top:.5rem; }
article.row > header { display:flex; gap:.7rem; align-items:flex-start; margin-bottom:.6rem; }
article.row > header h3 { flex:1; font-size:1.05rem; }
article.row > header .meta { white-space:nowrap; font-size:.9rem; text-align:right; }
.finding { margin:0 0 .6rem; padding:.3rem .6rem; border-left:4px solid var(--hi); background:#fbf3f3; }
.finding.warn { border-left-color:#d9a45b; background:#fff9ec; }
.grid { display:grid; grid-template-columns:minmax(0,1fr); gap:.7rem; }
.fx { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:.4rem; }
.fx .box { border:1px solid var(--line); border-radius:4px; padding:.35rem .55rem; background:#fafbfc; }
.fx .box.end { border-color:#b9838a; background:#fbf3f3; }
.fx .arrow { align-self:center; color:var(--muted); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.back { margin:.5rem 0 0; font-size:.85rem; }
.tile .pcounts { display:block; margin-top:.2rem; }
.attn-none { margin:0; }
table.index code { overflow-wrap:anywhere; }
.stale-notice { margin:0 0 .6rem; padding:.3rem .6rem; border-left:4px solid #d9a45b; background:#fff9ec; }
article.row > header .meta .pri { height:1.2rem; min-width:1.2rem; font-size:.75rem; }
.empty { color: #6b7177; font-style: italic; }
.mark + .mark { margin-left: 0.25rem; }

@media (max-width: 767px) {
  body { padding:1rem .75rem 3rem; }
  .strip { grid-template-columns:1fr; }
  .tiles { grid-auto-flow:row; grid-template-columns:repeat(2,1fr); }
  .tiles > .tile:last-child:nth-child(odd) { grid-column:1 / -1; }
  dl.header, .key dl { grid-template-columns:1fr; gap:0; }
  dl.header dd, .key dd { margin-bottom:.4rem; }
  .key dt { white-space:normal; }
  .vocabulary dl { grid-template-columns:minmax(0,1fr); gap:0; }
  .vocabulary dd { margin-bottom:.4rem; }
  .vocabulary dt { white-space:normal; }
  .attn-item { grid-template-columns:1fr; }
  .fx { grid-template-columns:1fr; }
  .fx .arrow { justify-self:center; transform:rotate(90deg); }
  .el { grid-template-columns:minmax(0,1fr); row-gap:.2rem; }
  .el-facts { grid-template-columns:fit-content(50%) minmax(0,1fr); }
  .two { grid-template-columns:1fr; }
  article.row > header { flex-wrap:wrap; }
  article.row > header h3 { flex-basis:calc(100% - 2.5rem); }
  article.row > header .meta { white-space:normal; text-align:left; flex-basis:100%; }
  main { overflow-wrap:anywhere; }
  .frame { overflow-wrap:normal; }
}

@media print {
  @page { size: landscape; margin: 12mm; }
  body { padding:0; font-size:11px; }
  .back { display:none; }
  h2, h3, article.row > header { break-after: avoid; }
  article.row, tr, .attn-item, .tile-group, .key, .el { break-inside: avoid; }
  thead { display: table-header-group; }
  a { color:inherit; text-decoration:none; }
  .frame { overflow-x:visible; }
}
</style>
</head>
<body>
<main>
<section id="header">
<!--@header-->
</section>
<section id="ground-rules">
<h2>Ground rules</h2>
<!--@ground-rules-->
</section>
<section id="assumptions">
<h2>Assumptions</h2>
<!--@assumptions-->
</section>
<section id="reviews">
<h2>Review record</h2>
<!--@reviews-->
</section>
<section id="structure">
<h2>Structure</h2>
<!--@structure-->
</section>
<section id="chains">
<h2>Failure chains</h2>
<!--@chains-->
</section>
<section id="actions">
<h2>Actions</h2>
<!--@actions-->
</section>
<section id="lints">
<h2>Automated checks and quality score</h2>
<!--@lints-->
</section>
<section id="provenance">
<h2>Provenance appendix</h2>
<!--@provenance-->
</section>
</main>
<script type="application/json" id="fmea-data"><!--@data--></script>
</body>
</html>
